# The app itself is stdlib only (no runtime dependencies). Dev tools only: `uv sync` installs them.
[project]
name = "ahflip"
version = "0.1.0"
description = "WoW Forever auction house flipping helper"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ahflip"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.vulture]
paths = ["ahflip", "tests", "ah.py"]
min_confidence = 80
